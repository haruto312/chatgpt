<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d36">
  <title>社内システムポータル</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #162f2a;
      --green: #215f4b;
      --muted: #546861;
      --rule: #d4ddd5;
      --paper: #f6f8f3;
      --lime: #def39c;
      font-family: Inter, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid #237953; outline-offset: 3px; }
    [hidden] { display: none !important; }
    .defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 1.4rem; height: 1.4rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .wrap { width: min(1120px, 92%); margin-inline: auto; }
    header { background: #173d36; color: white; }
    .mast { display: flex; align-items: center; justify-content: space-between; padding-block: 1rem; border-bottom: 1px solid #ffffff2e; }
    .brand { display: inline-flex; align-items: center; gap: .65rem; font-size: .94rem; font-weight: 700; letter-spacing: .025em; }
    .brand .icon { background: var(--lime); color: var(--ink); width: 2rem; height: 2rem; padding: .35rem; border-radius: .5rem; }
    time { color: #deeadf; font-size: .875rem; }
    .intro { display: grid; grid-template-columns: 1fr 16rem; align-items: center; gap: 2rem; padding-block: 2.4rem; }
    h1 { font-size: clamp(2rem, 4vw, 3.25rem); letter-spacing: -.045em; margin: 0 0 1.3rem; line-height: 1.22; }
    .search { display: flex; align-items: center; gap: .75rem; background: #fff; color: var(--muted); border-radius: .65rem; padding: .3rem .85rem; max-width: 37rem; }
    .search:focus-within { outline: 3px solid var(--lime); outline-offset: 3px; }
    .search input { background: transparent; flex: 1; width: 0; min-height: 2.6rem; border: 0; outline: none; }
    kbd { font: .875rem monospace; background: var(--paper); border: 1px solid var(--rule); padding: .08rem .45rem; border-radius: .28rem; }
    .art { height: 9rem; position: relative; isolation: isolate; background-image: radial-gradient(#ffffff40 1px, transparent 1px); background-size: 12px 12px; }
    .folder { position: absolute; width: 60%; height: 60%; left: 15%; top: 26%; border: 1.5px solid #183f35; border-radius: 0 .55rem .55rem .55rem; transform: rotate(-10deg) skew(-8deg); background: #739884; }
    .folder::before { content: ""; position: absolute; left: -1.5px; bottom: calc(100% - 1px); width: 44%; height: .8rem; background: inherit; border: 1.5px solid #183f35; border-bottom: none; border-radius: .45rem .6rem 0 0; }
    .folder:nth-child(2) { transform: translate(.75rem,.6rem) rotate(-5deg); background: #a8c8a4; }
    .folder:nth-child(3) { transform: translate(1.4rem,1.05rem); background: var(--lime); }
    .folder:last-child::after { content: ""; position: absolute; left: 12%; bottom: 20%; width: 24%; height: .55rem; border-block: 2px solid #3e654b; }
    main { padding-block: 2.2rem 3.5rem; }
    .heading, .tabs, .card, .service, .info { display: flex; align-items: center; }
    .heading { justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    h2 { margin: 0; font-size: 1.4rem; }
    #count { color: var(--muted); font: 400 .94rem sans-serif; margin-left: .65rem; }
    .tabs { gap: .2rem; border-radius: .65rem; background: #e8ede6; padding: .25rem; }
    .tabs button { background: transparent; border: 0; border-radius: .45rem; padding: .55rem .95rem; font-size: .9rem; min-height: 2.5rem; }
    .tabs button[aria-pressed="true"] { background: #fff; color: var(--green); font-weight: 700; box-shadow: 0 1px 4px #143d3029; }
    ul { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: .85rem; list-style: none; margin: 0; padding: 0; }
    .card { border: 1px solid var(--rule); border-radius: .8rem; background: #fff; padding-right: .65rem; }
    .card:focus-within, .card:hover { border-color: #8fa796; }
    .service { flex: 1; min-width: 0; padding: 1.25rem .65rem 1.25rem 1.15rem; gap: 1rem; align-self: stretch; color: inherit; text-decoration: none; border-radius: inherit; }
    .service:hover strong { text-decoration: underline; text-underline-offset: .2em; }
    .tile { display: grid; place-items: center; flex: none; width: 3rem; height: 3rem; border-radius: .7rem; background: var(--tile); color: var(--tone); }
    .tile .icon { width: 1.6rem; height: 1.6rem; }
    .info { flex-direction: column; align-items: flex-start; gap: .28rem; }
    .info strong { font-size: 1.05rem; line-height: 1.45; overflow-wrap: anywhere; }
    .info small { color: var(--muted); font-size: .875rem; }
    .pin { display: grid; place-items: center; flex: none; border: none; background: transparent; color: #67796d; border-radius: .55rem; width: 2.75rem; height: 2.75rem; }
    .pin .icon { width: 1.22rem; }
    .pin:hover { background: #edf2e8; }
    .pin[aria-pressed="true"] { color: #286145; background: #e9f3db; }
    .pin[aria-pressed="true"] .icon { fill: currentColor; }
    .note { color: var(--muted); font-size: .875rem; margin: 1rem 0 0; }
    .empty { padding: 2rem 1rem; text-align: center; border: 1px dashed #a8b7ab; border-radius: .8rem; }
    .empty button { border: 1px solid var(--rule); border-radius: .5rem; background: white; padding: .6rem .9rem; }
    @media (max-width: 680px) {
      .intro { display: block; padding-block: 1.8rem; }
      .art, kbd { display: none; }
      ul { grid-template-columns: 1fr; }
      main { padding-top: 1.5rem; }
      .service { padding: 1rem .4rem 1rem .9rem; gap: .75rem; }
    }
    @media (max-width: 380px) { .heading { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="brand" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="bookmark" viewBox="0 0 24 24"><path d="M6 4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17l-6-4-6 4z"/></symbol>
    <symbol id="board" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="15" rx="2"/><path d="M7 9h10M7 13h6M8 19v2m8-2v2"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="receipt" viewBox="0 0 24 24"><path d="M5 3l2 1.5L9 3l3 1.5L15 3l2 1.5L19 3v18l-2-1.5L15 21l-3-1.5L9 21l-2-1.5L5 21zM9 9h6m-6 4h4"/></symbol>
    <symbol id="wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="m5 6 11-4 1 4m4 6h-5v4h5"/></symbol>
    <symbol id="study" viewBox="0 0 24 24"><path d="m2 9 10-5 10 5-10 5zM6 11v6q6 4 12 0v-6m4-2v7"/></symbol>
    <symbol id="people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m1-15a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 5"/></symbol>
    <symbol id="union" viewBox="0 0 24 24"><path d="m2 9 10-6 10 6M4 10h16M5 20h14M8 11v6m4-6v6m4-6v6"/></symbol>
  </defs></svg>
  <header>
    <div class="wrap">
      <div class="mast"><span class="brand"><svg class="icon" aria-hidden="true"><use href="#brand"/></svg> 社内ポータル</span><time id="today"></time></div>
      <div class="intro">
        <div>
          <h1>社内システム</h1>
          <label class="search" hidden><svg class="icon" aria-hidden="true"><use href="#search"/></svg><input id="query" type="search" aria-label="サービスを検索" placeholder="名前や用途で検索（例：給与）"><kbd aria-hidden="true">/</kbd></label>
        </div>
        <div class="art" aria-hidden="true"><i class="folder"></i><i class="folder"></i><i class="folder"></i></div>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div class="heading">
      <h2>サービス一覧<span id="count" role="status">7件</span></h2>
      <div class="tabs" role="group" aria-label="表示するサービス" hidden>
        <button id="all" type="button" aria-pressed="true">すべて</button>
        <button id="pinned" type="button" aria-pressed="false">固定済み</button>
      </div>
    </div>
    <ul id="services">
      <li class="card" data-key="board" data-terms="けいじばん おしらせ ニュース 社内報" style="--tile:#e3eee3; --tone:#326347">
        <a class="service" href="https://portal.brexa-tech.jp/" target="_blank" rel="noopener noreferrer">
          <span class="tile"><svg class="icon" aria-hidden="true"><use href="#board"/></svg></span>
          <span class="info"><strong>掲示板</strong><small>社内のお知らせ</small></span>
        </a>
        <button type="button" class="pin" aria-label="掲示板を固定" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#bookmark"/></svg></button>
      </li>
      <li class="card" data-key="clock" data-terms="きんたい しゅったいきん たいむかーど 打刻" style="--tile:#dfeef3; --tone:#325e70">
        <a class="service" href="https://osg03-cws.company.works-hi.com/self-workflow/cws/cws" target="_blank" rel="noopener noreferrer">
          <span class="tile"><svg class="icon" aria-hidden="true"><use href="#clock"/></svg></span>
          <span class="info"><strong>勤怠管理</strong><small>出退勤・勤務時間</small></span>
        </a>
        <button type="button" class="pin" aria-label="勤怠管理を固定" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#bookmark"/></svg></button>
      </li>
      <li class="card" data-key="receipt" data-terms="ときうむ ときうむ けいひ せいさん りょうしゅうしょ 交通費" style="--tile:#fbecd5; --tone:#77501b">
        <a class="service" href="https://btec.secure.keihi.com/subdomains/sign_in" target="_blank" rel="noopener noreferrer">
          <span class="tile"><svg class="icon" aria-hidden="true"><use href="#receipt"/></svg></span>
          <span class="info"><strong>TOKIUM (経費)</strong><small>経費の申請・精算</small></span>
        </a>
        <button type="button" class="pin" aria-label="TOKIUM (経費)を固定" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#bookmark"/></svg></button>
      </li>
      <li class="card" data-key="wallet" data-terms="いーかくしん きゅうよ めいさい きゅうりょう" style="--tile:#eae5f2; --tone:#61497b">
        <a class="service" href="https://www2.e-kakushin.com/emember/servicetop.do?p=init" target="_blank" rel="noopener noreferrer">
          <span class="tile"><svg class="icon" aria-hidden="true"><use href="#wallet"/></svg></span>
          <span class="info"><strong>e革新 (給与明細)</strong><small>給与明細の確認</small></span>
        </a>
        <button type="button" class="pin" aria-label="e革新 (給与明細)を固定" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#bookmark"/></svg></button>
      </li>
      <li class="card" data-key="study" data-terms="きゃりしっぷ けんしゅう がくしゅう eラーニング" style="--tile:#dfefed; --tone:#286a65">
        <a class="service" href="https://www25.learningpark.jp/BREXA-education" target="_blank" rel="noopener noreferrer">
          <span class="tile"><svg class="icon" aria-hidden="true"><use href="#study"/></svg></span>
          <span class="info"><strong>CAREESHIP</strong><small>研修・オンライン学習</small></span>
        </a>
        <button type="button" class="pin" aria-label="CAREESHIPを固定" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#bookmark"/></svg></button>
      </li>
      <li class="card" data-key="people" data-terms="たれんとぱれっと じんざい 人事" style="--tile:#fae7df; --tone:#864e38">
        <a class="service" href="https://tiuy3435.talent-p.net/saml/sso" target="_blank" rel="noopener noreferrer">
          <span class="tile"><svg class="icon" aria-hidden="true"><use href="#people"/></svg></span>
          <span class="info"><strong>Talent Palette</strong><small>人材情報・タレント管理</small></span>
        </a>
        <button type="button" class="pin" aria-label="Talent Paletteを固定" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#bookmark"/></svg></button>
      </li>
      <li class="card" data-key="union" data-terms="ぶれくさ ろうどうくみあい ろうそ" style="--tile:#e9edda; --tone:#576630">
        <a class="service" href="https://www.union.ostechnology.jp/user/login?destination=/" target="_blank" rel="noopener noreferrer">
          <span class="tile"><svg class="icon" aria-hidden="true"><use href="#union"/></svg></span>
          <span class="info"><strong>BREXA Technology労働組合</strong><small>労働組合の窓口</small></span>
        </a>
        <button type="button" class="pin" aria-label="BREXA Technology労働組合を固定" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#bookmark"/></svg></button>
      </li>
    </ul>
    <div class="empty" hidden><p id="empty-text"></p><button type="button" id="reset">すべて表示</button></div>
    <p class="note">各サービスは新しいタブで開きます。<span id="pin-tip" hidden>右端のしおりで、よく使うサービスを先頭に固定できます。</span></p>
    <p id="storage-note" class="note" role="status" hidden></p>
  </main>
  <script>
    const list = document.querySelector('#services');
    const cards = Array.from(list.children);
    const input = document.querySelector('#query');
    const all = document.querySelector('#all');
    const pinned = document.querySelector('#pinned');
    const reset = document.querySelector('#reset');
    const empty = document.querySelector('.empty');
    const storageKey = 'haruto312.portal.pins.v1';
    const knownKeys = new Set(cards.map(card => card.dataset.key));
    let fixed = new Set();
    let onlyFixed = false;

    function readPins(value) {
      const parsed = JSON.parse(value || '[]');
      return new Set(Array.isArray(parsed) ? parsed.filter(key => knownKeys.has(key)) : []);
    }

    try {
      fixed = readPins(localStorage.getItem(storageKey));
    } catch {
      // The links and pin controls remain usable with in-memory state.
    }

    function normalize(text) {
      return text.normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,
        letter => String.fromCharCode(letter.charCodeAt(0) - 0x60));
    }

    const index = new Map(cards.map(card => [
      card, normalize(card.querySelector('.info').textContent + ' ' + card.dataset.terms)
    ]));

    function render() {
      const terms = normalize(input.value).trim().split(/\s+/).filter(Boolean);
      const focused = document.activeElement;
      const ordered = [...cards].sort((a, b) => Number(fixed.has(b.dataset.key)) - Number(fixed.has(a.dataset.key)));
      let count = 0;

      ordered.forEach((card, position) => {
        const selected = fixed.has(card.dataset.key);
        const button = card.querySelector('.pin');
        button.hidden = false;
        button.setAttribute('aria-pressed', String(selected));
        button.title = selected ? '固定を解除' : '先頭に固定';
        card.hidden = (onlyFixed && !selected) || !terms.every(term => index.get(card).includes(term));
        if (!card.hidden) count++;
        if (list.children[position] !== card) list.insertBefore(card, list.children[position]);
      });

      all.setAttribute('aria-pressed', String(!onlyFixed));
      pinned.setAttribute('aria-pressed', String(onlyFixed));
      pinned.textContent = '固定済み ' + fixed.size;
      document.querySelector('#count').textContent = count + '件';
      empty.hidden = count > 0;
      document.querySelector('#empty-text').textContent = onlyFixed && !fixed.size
        ? '固定済みのサービスはありません。サービスの右端にあるしおりで固定できます。'
        : '条件に一致するサービスがありません。';

      if (focused?.matches('.pin, .service')) {
        if (!focused.closest('li').hidden) focused.focus({ preventScroll: true });
        else (list.querySelector('li:not([hidden]) .pin') || reset).focus();
      }
    }

    list.addEventListener('click', event => {
      const button = event.target.closest('.pin');
      if (!button) return;
      const key = button.closest('li').dataset.key;
      if (fixed.has(key)) fixed.delete(key);
      else fixed.add(key);
      try {
        localStorage.setItem(storageKey, JSON.stringify([...fixed]));
      } catch {
        const note = document.querySelector('#storage-note');
        note.textContent = 'このブラウザーでは固定設定を保存できないため、ページを開いている間だけ反映します。';
        note.hidden = false;
      }
      render();
    });

    window.addEventListener('storage', event => {
      if (event.key !== storageKey && event.key !== null) return;
      try { fixed = readPins(event.newValue); } catch { return; }
      render();
    });

    input.addEventListener('input', render);
    all.addEventListener('click', () => { onlyFixed = false; render(); });
    pinned.addEventListener('click', () => { onlyFixed = true; render(); });
    reset.addEventListener('click', () => {
      input.value = '';
      onlyFixed = false;
      render();
      input.focus();
    });
    document.addEventListener('keydown', event => {
      if (event.isComposing || event.ctrlKey || event.altKey || event.metaKey) return;
      if (event.key === '/' && event.target !== input) {
        event.preventDefault();
        input.focus();
      } else if (event.key === 'Escape' && event.target === input) {
        input.value = '';
        render();
      }
    });

    const today = new Date();
    const date = document.querySelector('#today');
    date.dateTime = [today.getFullYear(), String(today.getMonth() + 1).padStart(2,'0'), String(today.getDate()).padStart(2,'0')].join('-');
    date.textContent = new Intl.DateTimeFormat('ja-JP', {month:'long', day:'numeric', weekday:'short'}).format(today);
    for (const element of document.querySelectorAll('.tabs, .search, #pin-tip')) element.hidden = false;
    render();
  </script>
</body>
</html>
